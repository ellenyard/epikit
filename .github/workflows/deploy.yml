name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        timeout-minutes: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          # Retry npm ci up to 3 times with exponential backoff
          for i in 1 2 3; do
            if npm ci; then
              break
            fi
            if [ $i -lt 3 ]; then
              echo "npm ci failed, retrying in $((2**i)) seconds..."
              sleep $((2**i))
            else
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
          done
        timeout-minutes: 10

      # Gates run before the build so a failure stops the deploy rather than
      # shipping and reporting afterwards.
      - name: Lint
        run: npm run lint
        timeout-minutes: 5

      - name: Tests
        run: |
          npm run test:csv
          npm run test:locale
          npm run test:area-map
          npm run test:labels
          npm run test:chart-defaults
          npm run test:statistics
          npm run test:epicurve-bins
          npm run test:geo-privacy
          npm run test:import-types
          npm run test:persistence
          npm run test:variables
          npm run test:data-quality
          npm run test:chart-aggregation
          npm run test:chunk-recovery
          npm run test:sketch
        timeout-minutes: 10

      - name: Build
        run: npm run build
        timeout-minutes: 15

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
